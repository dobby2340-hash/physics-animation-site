<!doctype html><html lang=zh-CN><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>单摆运动示例</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f9fc;font-family:system-ui}main{height:100%;display:grid;place-items:center}.scene{position:relative;width:min(760px,90vw);height:min(520px,80vh);border-radius:28px;background:#fff;box-shadow:0 20px 60px #dce3ef}.pivot{position:absolute;left:50%;top:72px;width:14px;height:14px;border-radius:50%;background:#14213d;transform:translate(-50%,-50%)}.pendulum{position:absolute;left:50%;top:72px;width:3px;height:260px;background:#4d70ff;transform-origin:50% 0;animation:swing 2.5s ease-in-out infinite alternate}.ball{position:absolute;left:50%;bottom:-29px;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#6f8bff,#1e49f3);transform:translateX(-50%);box-shadow:0 12px 24px #b4c2fb}@keyframes swing{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}</style></head><body><main><section class=scene><div class=pivot></div><div class=pendulum><div class=ball></div></div></section></main></body></html>
